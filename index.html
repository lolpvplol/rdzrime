<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Топ ГДЗ Сервис</title>
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            padding-top: 50px; 
        }
        .btn { 
            background: #252525; 
            color: white; 
            border: 1px solid #444; 
            padding: 12px 24px; 
            margin: 10px; 
            cursor: pointer; 
            border-radius: 6px; 
            font-size: 16px;
        }
        .btn:hover { 
            background: #383838; 
        }
        #output {
            margin-top: 40px; 
            color: #aaa;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать в ГДЗ Онлайн</h1>
    <p>Выберите класс для начала работы:</p>
    
    <!-- Кнопки выбора классов -->
    <button class="btn">7 Класс</button>
    <button class="btn">8 Класс</button>
    <button class="btn">9 Класс</button>
    
    <div id="output">Здесь будут выводиться текстовые ответы из скачанного файла database.json</div>
</body>
</html>
